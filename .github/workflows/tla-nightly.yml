name: TLA+ nightly

# The configurations too large for every push: every reachable state, nightly.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  tla:
    name: TLA+ model (${{ matrix.cfg }}, exhaustive)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        cfg: [Restart, TwoNodes]
    env:
      TLA2TOOLS: ${{ github.workspace }}/tla2tools.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Download TLC (pinned)
        run: |
          curl -sSfLo "$TLA2TOOLS" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $TLA2TOOLS" | sha256sum -c -
      - name: Model-check
        working-directory: spec/tla
        run: ./check.sh ${{ matrix.cfg }}.cfg
