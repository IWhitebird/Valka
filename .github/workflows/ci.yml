name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: iwhitebird/valka

jobs:
  fmt:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: Rust 1.89 (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo check --workspace --all-targets

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Unit, integration and three-node tests (in-memory object store)
        run: cargo test --workspace
      - name: Randomized cluster simulation, more seeds
        run: cargo test -p valka-engine --lib randomized_cluster
        env:
          VALKA_SIM_SEEDS: "64"
          VALKA_SIM_SEED: "100000"

  minio:
    name: Rust tests on S3 (MinIO)
    runs-on: ubuntu-latest
    env:
      VALKA_TEST_S3_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # pgsty/silo is an S3-compatible MinIO fork (minio/minio is no longer on Docker Hub).
      - name: Start the object store
        run: |
          docker run -d --name s3 -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:latest server /data
          for i in $(seq 1 60); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
          docker exec s3 sh -c "mc alias set local http://localhost:9000 minioadmin minioadmin && mc mb --ignore-existing local/valka-test"
      - run: cargo test -p valka-tests --features minio minio_

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  www:
    name: Website and docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci
      - run: npm run types:check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  sdk-go:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: |
            sdks/go/go.sum
            examples/go/go.sum
      - name: Format
        working-directory: sdks/go
        run: test -z "$(gofmt -l $(git ls-files '*.go' | grep -v '^proto/'))"
      - name: Vet and test
        working-directory: sdks/go
        run: go vet ./... && go test ./...
      - name: Examples build
        working-directory: examples/go
        run: go build ./...

  sdk-python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - run: ruff check . ../../examples/python
      - run: ruff format --check src tests ../../examples/python
      - run: pytest -q tests

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  tla:
    name: TLA+ model (${{ matrix.cfg }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Restart and TwoNodes take hours exhaustively: simulated here, checked in full
        # nightly (tla-nightly.yml).
        cfg: [Ownership, Splitters, Liveness, Restart-sim, TwoNodes-sim, counterexamples]
    env:
      TLA2TOOLS: ${{ github.workspace }}/tla2tools.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Download TLC (pinned)
        run: |
          curl -sSfLo "$TLA2TOOLS" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $TLA2TOOLS" | sha256sum -c -
      - name: Model-check
        if: matrix.cfg != 'counterexamples' && !endsWith(matrix.cfg, '-sim')
        working-directory: spec/tla
        run: ./check.sh ${{ matrix.cfg }}.cfg
      - name: Simulate
        if: endsWith(matrix.cfg, '-sim')
        working-directory: spec/tla
        run: ./check.sh --simulate 100000 "${CFG%-sim}.cfg"
        env:
          CFG: ${{ matrix.cfg }}
      - name: Counterexamples still fail
        if: matrix.cfg == 'counterexamples'
        working-directory: spec/tla
        run: ./check.sh --expect-fail counterexamples/*.cfg

  docker:
    name: Image (ghcr.io)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, msrv, test, minio, web, www, sdk-go, sdk-python, sdk-typescript, tla]
    # Images are pushed for master only, never for pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          echo "tags=${REGISTRY}/${IMAGE_NAME}:latest,${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
