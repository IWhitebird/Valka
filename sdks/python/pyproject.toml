[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "valka"
version = "0.2.0"
description = "Python SDK for the Valka distributed task queue"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25",
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60",
    "mypy>=1.8",
    "pytest>=7",
    "ruff>=0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/valka"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/valka/_proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
