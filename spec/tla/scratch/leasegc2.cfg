\* EXPECTED TO FAIL (AckedDurable). GC deletes a long-dead lease that no owner record names
\* and whose logs are gone. The node restarts as incarnation 1 again; an old split marker
\* for incarnation 1 is still there (a snapshot points into it), so when the new
\* incarnation 1 dies, a claimer takes its shard without splitting its log.
CONSTANTS
    Node = {a, b}
    Shard = {s1}
    NoNode = NoNode
    MaxInc = 1
    MaxRec = 1
    MaxGen = 4
    Splitters = {1}
    SplitRule = "watermark"
    StrictEmptyClaim = FALSE
    LiveModel = FALSE
    StableNode = a
    GcLeases = TRUE
SPECIFICATION Spec
INVARIANTS AckedDurable GCSafety
