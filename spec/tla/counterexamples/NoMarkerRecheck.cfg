\* EXPECTED TO FAIL (WellFormed). Two splitters on one dead incarnation, and the slow one
\* does not re-check the split marker before writing. The fast one seals position 1 (its
\* PUT is still in flight), finds nothing, writes the marker; GC deletes the log including
\* the seal; the late PUT for position 1 now lands; the slow splitter lists 1 and 2, reads
\* while GC deletes 1 again, and writes a split snapshot with shard_seq 2 but not 1, which
\* becomes the shard's newest snapshot.
CONSTANTS
    Node = {a}
    Shard = {s1}
    NoNode = NoNode
    MaxInc = 1
    MaxRec = 2
    MaxGen = 2
    Splitters = {1, 2}
    SplitRule = "watermark"
    StrictEmptyClaim = FALSE
    LiveModel = FALSE
    StableNode = a
    GcLeases = FALSE
    RecheckMarker = FALSE
    BasesFirst = FALSE
SPECIFICATION Spec
INVARIANTS WellFormed AckedDurable LinearHistory NoLiveLogSealed GCSafety
