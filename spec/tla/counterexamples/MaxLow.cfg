\* EXPECTED TO FAIL (WellFormed). Start reading at max(watermark, lowest listed position).
\* Segment 1 is still in flight when segment 2 lands; the lowest listed position is 2, so
\* the split applies shard_seq 2 without shard_seq 1 and writes a history with a hole.
CONSTANTS
    Node = {a}
    Shard = {s1}
    NoNode = NoNode
    MaxInc = 1
    MaxRec = 2
    MaxGen = 2
    Splitters = {1}
    SplitRule = "maxlow"
    StrictEmptyClaim = FALSE
    LiveModel = FALSE
    StableNode = a
    GcLeases = FALSE
    RecheckMarker = TRUE
    BasesFirst = FALSE
SPECIFICATION Spec
INVARIANTS WellFormed AckedDurable LinearHistory NoLiveLogSealed GCSafety
