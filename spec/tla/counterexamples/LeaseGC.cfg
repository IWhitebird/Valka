\* EXPECTED TO FAIL (GCSafety). GC deletes a long-dead lease that no owner record names
\* and whose logs are gone. The node restarts as incarnation 1 again while the old split
\* marker for incarnation 1 still exists, so the split-log collector deletes the new,
\* live incarnation 1's acknowledged segment. (With all invariants on, TLC first reports an
\* even shorter trace: a slow splitter of the old incarnation 1 seals the new one's log.)
CONSTANTS
    Node = {a, b}
    Shard = {s1}
    NoNode = NoNode
    MaxInc = 1
    MaxRec = 1
    MaxGen = 4
    Splitters = {1}
    SplitRule = "watermark"
    StrictEmptyClaim = FALSE
    LiveModel = FALSE
    StableNode = a
    GcLeases = TRUE
    RecheckMarker = TRUE
    BasesFirst = FALSE
SPECIFICATION Spec
INVARIANTS AckedDurable GCSafety
