\* EXPECTED TO FAIL (GCSafety). The split as first drafted: seal the first gap after the
\* lowest listed position, no watermark. A zombie's ascending truncation racing the LIST
\* makes a deleted position look like the end of the log; the seal lands there and the
\* acked segments above it are lost when the split log is collected. Only the acked-loss
\* invariants are checked so TLC reports this hazard rather than the malformed history of
\* MaxLow.cfg, which this rule also has.
CONSTANTS
    Node = {a}
    Shard = {s1}
    NoNode = NoNode
    MaxInc = 1
    MaxRec = 3
    MaxGen = 2
    Splitters = {1}
    SplitRule = "draft"
    StrictEmptyClaim = FALSE
    LiveModel = FALSE
    StableNode = a
    GcLeases = FALSE
    RecheckMarker = FALSE
    BasesFirst = FALSE
SPECIFICATION Spec
INVARIANTS AckedDurable GCSafety
