\* EXPECTED TO FAIL (EventuallyServed). A claim refuses "no snapshot at all" above gen 1, as
\* first drafted. A claimer that crashes between its owner CAS and its acquisition snapshot
\* leaves gen 1 and no snapshot; every later claimer refuses forever.
CONSTANTS
    Node = {a, b}
    Shard = {s1}
    NoNode = NoNode
    MaxInc = 2
    MaxRec = 1
    MaxGen = 3
    Splitters = {1}
    SplitRule = "watermark"
    StrictEmptyClaim = TRUE
    LiveModel = TRUE
    StableNode = b
    GcLeases = FALSE
    RecheckMarker = TRUE
    BasesFirst = FALSE
SPECIFICATION LiveSpec
PROPERTY EventuallyServed
