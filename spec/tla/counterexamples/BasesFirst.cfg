\* EXPECTED TO FAIL (WellFormed). Two splitters, and the slow one loads the owner records
\* and its base snapshots before listing and reading the log. The fast one finishes; GC
\* deletes the log and, once the zombie owner's release left no owner record naming the
\* incarnation, the marker too. The slow splitter's marker re-check then passes, and it
\* applies what is left of the log to its stale base: a split snapshot with a hole.
\* Loading owner records and bases after reading avoids it: by then they reflect the
\* finished split and the release.
CONSTANTS
    Node = {a}
    Shard = {s1}
    NoNode = NoNode
    MaxInc = 1
    MaxRec = 2
    MaxGen = 2
    Splitters = {1, 2}
    SplitRule = "watermark"
    StrictEmptyClaim = FALSE
    LiveModel = FALSE
    StableNode = a
    GcLeases = FALSE
    RecheckMarker = TRUE
    BasesFirst = TRUE
SPECIFICATION Spec
INVARIANTS WellFormed AckedDurable LinearHistory NoLiveLogSealed GCSafety
