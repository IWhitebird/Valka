\* One node, one shard, one incarnation, three records. The incarnation is tombstoned while
\* it may still be running, so this is the zombie case: a fenced writer keeps flushing,
\* snapshotting and truncating while splitters LIST, seal and read its log, PUTs land late
\* and out of order, and GC deletes the split log, snapshots and markers.
CONSTANTS
    Node = {a}
    Shard = {s1}
    NoNode = NoNode
    MaxInc = 1
    MaxRec = 3
    MaxGen = 2
    Splitters = {1}
    SplitRule = "watermark"
    StrictEmptyClaim = FALSE
    LiveModel = FALSE
    StableNode = a
    GcLeases = FALSE
    RecheckMarker = TRUE
    BasesFirst = FALSE
SPECIFICATION Spec
INVARIANTS WellFormed AckedDurable LinearHistory NoLiveLogSealed GCSafety
