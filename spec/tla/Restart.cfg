\* One node restarted: the new incarnation fences the old one, which may keep running as a
\* zombie. The old log is split (by anyone, including the new incarnation) and its shard
\* claimed again.
CONSTANTS
    Node = {a}
    Shard = {s1}
    NoNode = NoNode
    MaxInc = 2
    MaxRec = 2
    MaxGen = 2
    Splitters = {1}
    SplitRule = "watermark"
    StrictEmptyClaim = FALSE
    LiveModel = FALSE
    StableNode = a
    GcLeases = FALSE
    RecheckMarker = TRUE
    BasesFirst = FALSE
SPECIFICATION Spec
INVARIANTS WellFormed AckedDurable LinearHistory NoLiveLogSealed GCSafety
