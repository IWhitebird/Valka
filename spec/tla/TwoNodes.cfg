\* Two nodes, two shards: claims race, releases hand shards over, one segment carries
\* records of both shards, and the truncation bound is a minimum over shards.
CONSTANTS
    Node = {a, b}
    Shard = {s1, s2}
    NoNode = NoNode
    MaxInc = 1
    MaxRec = 2
    MaxGen = 2
    Splitters = {1}
    SplitRule = "watermark"
    StrictEmptyClaim = FALSE
    LiveModel = FALSE
    StableNode = a
    GcLeases = FALSE
    RecheckMarker = TRUE
    BasesFirst = FALSE
SPECIFICATION Spec
SYMMETRY Symmetry
CONSTRAINT OneInFlight
INVARIANTS WellFormed AckedDurable LinearHistory NoLiveLogSealed GCSafety
