\* G5 under weak fairness: node a crashes and restarts at will, b starts once and never
\* fails; a shard whose owner is fenced is eventually served by a live incarnation.
\* No symmetry: it is unsound for liveness.
CONSTANTS
    Node = {a, b}
    Shard = {s1}
    NoNode = NoNode
    MaxInc = 2
    MaxRec = 1
    MaxGen = 3
    Splitters = {1}
    SplitRule = "watermark"
    StrictEmptyClaim = FALSE
    LiveModel = TRUE
    StableNode = b
    GcLeases = FALSE
    RecheckMarker = TRUE
    BasesFirst = FALSE
SPECIFICATION LiveSpec
PROPERTY EventuallyServed
