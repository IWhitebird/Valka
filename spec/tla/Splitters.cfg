\* Two splitters on the same dead incarnation at once: one may finish, write the marker and
\* start collecting the log while the other is still listing or reading it.
CONSTANTS
    Node = {a}
    Shard = {s1}
    NoNode = NoNode
    MaxInc = 1
    MaxRec = 2
    MaxGen = 2
    Splitters = {1, 2}
    SplitRule = "watermark"
    StrictEmptyClaim = FALSE
    LiveModel = FALSE
    StableNode = a
    GcLeases = FALSE
    RecheckMarker = TRUE
    BasesFirst = FALSE
SPECIFICATION Spec
INVARIANTS WellFormed AckedDurable LinearHistory NoLiveLogSealed GCSafety
