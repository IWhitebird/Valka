# Local development: MinIO (S3-compatible object store) + Valka.
# The bucket is the only durable state. For production variants, see deploy/docker/
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Creates the buckets once MinIO is up, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/valka &&
      mc mb --ignore-existing local/valka-test &&
      echo buckets ready"

  valka-server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      VALKA_NODE_ID: valka-1
      VALKA_STORAGE__BACKEND: s3
      VALKA_STORAGE__BUCKET: valka
      VALKA_STORAGE__ENDPOINT: http://minio:9000
      VALKA_STORAGE__REGION: us-east-1
      VALKA_STORAGE__ALLOW_HTTP: "true"
      VALKA_STORAGE__ACCESS_KEY_ID: minioadmin
      VALKA_STORAGE__SECRET_ACCESS_KEY: minioadmin
      VALKA_GRPC_ADDR: "[::]:50051"
      VALKA_HTTP_ADDR: "0.0.0.0:8989"
      RUST_LOG: valka=info,tower_http=info
    ports:
      - "50051:50051"
      - "8989:8989"
    restart: unless-stopped

volumes:
  miniodata:
