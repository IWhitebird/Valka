syntax = "proto3";

package valka.v1;

// Node-to-node RPCs on the internal listener (cluster.internal_addr). Every call carries
// `authorization: Bearer <cluster.token>`; mTLS is optional. Bodies are JSON-encoded Rust
// types from `valka-cluster` (`Command`, `Reply`, `Query`, `ScatterReply`), so adding a
// command does not change this file. See docs/wal/PHASE2.md §11.
service InternalService {
    // Run an id-routed command on the node that owns its shard. A node that does not own
    // the shard answers with error code NOT_OWNER and, if it knows one, an owner hint.
    // It never forwards the call itself.
    rpc Execute(ExecuteRequest) returns (ExecuteResponse);

    // Answer a cluster-wide query from this node's shards only (list, count, stats).
    rpc Scatter(ScatterRequest) returns (ScatterResponse);

    // Health and identity.
    rpc Ping(PingRequest) returns (PingResponse);
}

message ExecuteRequest {
    bytes command = 1;      // JSON `Command`
    string from_node = 2;
}

message ExecuteResponse {
    bytes reply = 1;        // JSON `Reply`, when `error` is unset
    RpcError error = 2;
}

message ScatterRequest {
    bytes query = 1;        // JSON `Query`
    string from_node = 2;
}

message ScatterResponse {
    bytes reply = 1;        // JSON `ScatterReply`
    RpcError error = 2;
}

message RpcError {
    string code = 1;        // NOT_OWNER, NOT_FOUND, INVALID_STATE, CONFLICT, BAD_REQUEST, UNAVAILABLE, INTERNAL
    string message = 2;
    uint32 shard = 3;
    string owner_hint = 4;  // node id this node believes owns `shard`
    bytes detail = 5;       // JSON `ServerError`, the exact error
}

message PingRequest {
    string node_id = 1;
}

message PingResponse {
    string node_id = 1;
    int64 timestamp_ms = 2;
    uint32 incarnation = 3;
    uint32 protocol = 4;
}
