syntax = "proto3";

package valka.v1;

import "valka/v1/common.proto";

service WorkerService {
    // Primary bidirectional stream for ALL worker communication
    rpc Session(stream WorkerRequest) returns (stream WorkerResponse);
    // Persist the result of a completed step of a running task. Returns once durable.
    rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse);
}

// Worker -> Server
message WorkerRequest {
    oneof request {
        WorkerHello hello = 1;
        TaskResult task_result = 2;
        Heartbeat heartbeat = 3;
        LogBatch log_batch = 4;
        GracefulShutdown shutdown = 5;
        SignalAck signal_ack = 6;
    }
}

// Server -> Worker
message WorkerResponse {
    oneof response {
        TaskAssignment task_assignment = 1;
        TaskCancellation task_cancellation = 2;
        HeartbeatAck heartbeat_ack = 3;
        ServerShutdown server_shutdown = 4;
        TaskSignal task_signal = 5;
        ResultAck result_ack = 6;
    }
}

// --- Worker -> Server messages ---

message WorkerHello {
    string worker_id = 1;
    string worker_name = 2;
    repeated string queues = 3;
    int32 concurrency = 4;
    string metadata = 5;           // JSON string
}

message TaskResult {
    string task_id = 1;
    string task_run_id = 2;
    bool success = 3;
    bool retryable = 4;
    string output = 5;             // JSON string
    string error_message = 6;
}

message Heartbeat {
    repeated string active_task_ids = 1;
    int64 timestamp_ms = 2;
}

message LogBatch {
    repeated LogEntry entries = 1;
}

message LogEntry {
    string task_run_id = 1;
    int64 timestamp_ms = 2;
    LogLevel level = 3;
    string message = 4;
    string metadata = 5;           // JSON string
}

message GracefulShutdown {
    string reason = 1;
}

// --- Server -> Worker messages ---

message TaskAssignment {
    string task_id = 1;
    string task_run_id = 2;
    string queue_name = 3;
    string task_name = 4;
    string input = 5;              // JSON string
    int32 attempt_number = 6;
    int32 timeout_seconds = 7;
    string metadata = 8;           // JSON string
    repeated StepCheckpoint checkpoints = 9;
}

message StepCheckpoint {
    string step = 1;
    string output = 2;             // JSON string
    int32 attempt_number = 3;
    int64 created_at_ms = 4;
}

message TaskCancellation {
    string task_id = 1;
    string reason = 2;
}

message HeartbeatAck {
    int64 server_timestamp_ms = 1;
}

message ServerShutdown {
    string reason = 1;
    int32 drain_seconds = 2;
}

message TaskSignal {
    string signal_id = 1;
    string task_id = 2;
    string signal_name = 3;
    string payload = 4;          // JSON string
    int64 timestamp_ms = 5;
}

message SignalAck {
    string signal_id = 1;
}

// Answer to a TaskResult. Workers keep a result until it is APPLIED or STALE.
message ResultAck {
    string task_id = 1;
    string task_run_id = 2;
    ResultStatus status = 3;
    string message = 4;
}

enum ResultStatus {
    RESULT_STATUS_UNSPECIFIED = 0;
    // The result is durable, now or from an earlier delivery of the same result.
    RESULT_STATUS_APPLIED = 1;
    // The run already ended another way (lease expired, cancelled, deleted); not recorded.
    RESULT_STATUS_STALE = 2;
    // Not recorded yet; send it again.
    RESULT_STATUS_RETRY = 3;
}

// --- Checkpoints ---

message CheckpointRequest {
    string task_id = 1;
    string task_run_id = 2;
    string step = 3;
    string output = 4;             // JSON string
}

message CheckpointResponse {}
