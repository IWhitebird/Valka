# Phase 1 of the WAL architecture: one node owns every shard. Multi-node shard
# ownership lands in phase 2 (docs/wal/PLAN.md); keep this at 1 until then.
replicaCount: 1

image:
  repository: ghcr.io/iwhitebird/valka
  pullPolicy: IfNotPresent
  tag: ""  # defaults to Chart.appVersion

nameOverride: ""
fullnameOverride: ""

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

service:
  type: ClusterIP
  grpcPort: 50051
  httpPort: 8989

# -- Valka configuration (rendered into ConfigMap as valka.toml)
config:
  numPartitions: 12  # should be a multiple of replicaCount

  gossip:
    clusterName: valka
    port: 7280

  wal:
    flushIntervalMs: 50
    snapshotIntervalSecs: 60
    completedRetentionSecs: 86400

  matching:
    maxBufferPerPartition: 1000
    feederBatchSize: 200

  scheduler:
    leaseGraceSecs: 30
    heartbeatLeaseSecs: 60

  logIngester:
    batchSize: 100
    flushIntervalMs: 500

# -- Object storage: the only durable state.
storage:
  bucket: valka
  prefix: ""
  region: us-east-1
  # Custom endpoint for S3-compatible stores (MinIO, R2). Empty = AWS S3.
  endpoint: ""
  allowHttp: false
  # Static credentials. Leave empty to use the pod's IAM role (IRSA) / default chain.
  accessKeyId: ""
  secretAccessKey: ""
  # Use an existing Secret with keys `access-key-id` and `secret-access-key` instead.
  existingSecret: ""

# -- Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# -- Prometheus ServiceMonitor
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - valka
          topologyKey: kubernetes.io/hostname
