# Single-node deployment: Valka + an S3-compatible bucket.
#
# In production point Valka at a real bucket (AWS S3, R2, GCS-S3, ...) and drop the
# MinIO services. Copy .env.example to .env and edit before running.
#
# Usage:
#   docker compose up -d

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-valka}"

  valka:
    image: ghcr.io/iwhitebird/valka:latest
    build:
      context: ../../
      dockerfile: Dockerfile
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      # Stable node id so a restarted node replays its own WAL.
      VALKA_NODE_ID: ${VALKA_NODE_ID:-valka-1}
      VALKA_STORAGE__BACKEND: s3
      VALKA_STORAGE__BUCKET: ${S3_BUCKET:-valka}
      VALKA_STORAGE__ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      VALKA_STORAGE__REGION: ${S3_REGION:-us-east-1}
      VALKA_STORAGE__ALLOW_HTTP: ${S3_ALLOW_HTTP:-true}
      VALKA_STORAGE__ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      VALKA_STORAGE__SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      VALKA_GRPC_ADDR: "0.0.0.0:50051"
      VALKA_HTTP_ADDR: "0.0.0.0:8989"
      RUST_LOG: ${RUST_LOG:-valka=info,tower_http=info}
    ports:
      - "50051:50051"
      - "8989:8989"
    restart: unless-stopped

volumes:
  miniodata:
