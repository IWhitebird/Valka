[package]
name = "valka-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Tests against a real S3-compatible endpoint (MinIO). Needs VALKA_TEST_S3_ENDPOINT.
minio = []

[dependencies]
valka-core = { workspace = true }
valka-proto = { workspace = true }
valka-matching = { workspace = true }
valka-dispatcher = { workspace = true }
valka-cluster = { workspace = true }
valka-engine = { workspace = true }
valka-wal = { workspace = true }
valka-sdk = { workspace = true }
valka-server = { path = "../valka-server" }
tokio = { workspace = true, features = ["test-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
tonic = { workspace = true }
dashmap = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http-body-util = "0.1"
object_store = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
hyper = { version = "1.6", features = ["full"] }
tokio-stream = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
cargo-husky = { version = "1", default-features = false, features = ["prepush-hook", "run-cargo-fmt", "run-cargo-clippy"] }
